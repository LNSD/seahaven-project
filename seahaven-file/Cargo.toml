[package]
name = "seahaven-file"
description = "Seahaven setup description file"
version = "0.1.0"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[features]
default = ["parse", "display"]
parse = ["dep:once_cell", "dep:regress"]
display = []


[dependencies]
anyhow = "1.0"
indexmap = { version = "2.9.0", features = ["serde"] }
once_cell = { version = "1.21.3", optional = true }
regress = { version = "0.10.3", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde-envfile = { version = "0.2.0", features = ["preserve_order"], git = "https://github.com/LNSD/serde-envfile.git", rev = "7d02f71" }
serde_yaml = "0.9"
thiserror = "2.0"

[dev-dependencies]
indoc = "2.0"
seahaven-file-testdata = { path = "testdata" }
