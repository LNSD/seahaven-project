[package]
name = "seahaven-package"
description = "The Seahaven package manifest"
version = "0.1.0"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0"
once_cell = "1.21.3"
regress = "0.10.3"
