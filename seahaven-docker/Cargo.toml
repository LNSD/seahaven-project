[package]
name = "seahaven-docker"
description = "Seahaven docker support"
version = "0.1.0"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
indoc = "2.0.6"
semver = { version = "1.0.26", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_with = "3.12.0"
thiserror = "2.0.12"
tokio = { version = "1.44", default-features = false, features = ["process"] }
which = "7.0.2"

[dev-dependencies]
test-with = { version = "0.14.8", default-features = false }
tokio = { version = "1.44", features = ["macros", "rt"] }
