[package]
name = "seahaven-just"
description = "A Rust wrapper for the just command runner"
version = "0.2.0"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
semver = "1.0.26"
thiserror = "2.0.12"
tokio = { version = "1.44", default-features = false, features = ["macros", "process"] }
which = "8.0.0"

[dev-dependencies]
test-with = { version = "0.14", default-features = false }
tokio = { version = "1.44", features = ["macros", "rt"] }
